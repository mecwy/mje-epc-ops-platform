name: phase0-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Protect committed migration history
        run: pnpm check:migrations
        env:
          MJE_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MJE_MIGRATION_HEAD: ${{ github.sha }}
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm test:smoke
      - run: pnpm test:container
      - run: az bicep install --version v0.47.16
      - run: az bicep build --file infra/bicep/dev-subscription.bicep --outfile /tmp/dev-alpha.json
      - run: az bicep build --file infra/bicep/dev-owner-app.bicep --outfile /tmp/dev-owner-app.json
      - run: az bicep build --file infra/bicep/dev-migration-job.bicep --outfile /tmp/dev-migration-job.json
      - run: docker compose up -d --wait postgres azurite
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm test:alpha
      - run: pnpm test:alpha-lookups
      - run: pnpm test:project-status
      - run: pnpm test:project-master
      - run: pnpm test:report
      - run: pnpm test:issues
      - run: pnpm test:photos
      - run: pnpm test:report-lookups
      - run: pnpm test:field
      - run: pnpm test:add-member
      - run: pnpm test:authz-version
      - run: pnpm test:tx-protocol
      - if: always()
        run: docker compose down
