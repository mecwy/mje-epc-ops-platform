name: azure-dev-what-if
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require exact Dev target
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          test -n "$CLIENT_ID"
          test -n "$TENANT_ID"
          test -n "$SUBSCRIPTION_ID"
          test "$RESOURCE_GROUP" = mjeepc-dev
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Compile and preview passwordless Dev foundation
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az bicep build --file infra/bicep/dev-alpha.bicep --stdout > "$RUNNER_TEMP/dev-alpha.json"
          az deployment group what-if \
            --subscription "$SUBSCRIPTION_ID" \
            --resource-group "$RESOURCE_GROUP" \
            --name alpha-dev-preview \
            --template-file "$RUNNER_TEMP/dev-alpha.json" \
            --parameters location=francecentral \
            --validation-level ProviderNoRbac \
            --result-format ResourceIdOnly \
            --output none
          echo 'Dev-only ARM what-if completed.'
